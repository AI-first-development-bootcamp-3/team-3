name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'

jobs:
  lint-test:
    name: lint-test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      - run: npm run lint
        working-directory: ${{ matrix.app }}

      - run: npm run test
        working-directory: ${{ matrix.app }}

  build:
    name: build (${{ matrix.app }})
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      - run: npm run build
        working-directory: ${{ matrix.app }}

  docker-build:
    name: docker-build (${{ matrix.app }})
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Depends on SCRUM-52 (test DB config for integration tests), which is still
  # In Progress as of this workflow being written. DATABASE_URL/JWT_SECRET/
  # CORS_ORIGIN below follow backend/.env.example and src/config/env.ts, and
  # `npm run test` runs the full vitest suite since no separate integration
  # script exists yet. Revisit this job once SCRUM-52 lands and defines real
  # integration-test conventions (e.g. a dedicated `test:integration` script).
  integration-test:
    name: integration-test (backend)
    needs: lint-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abra_test
      JWT_SECRET: ci-only-secret-not-used-in-any-real-environment
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npx prisma migrate deploy
        working-directory: backend

      - run: npm run test
        working-directory: backend
