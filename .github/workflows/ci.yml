name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      - run: npm run lint
        working-directory: ${{ matrix.app }}

  test-frontend:
    name: test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run test
        working-directory: frontend

  # backend/vitest.config.ts wires a globalSetup (src/test/globalSetup.ts)
  # that runs `prisma migrate deploy` against a real Postgres before every
  # test file, unconditionally — this repo doesn't separate "unit" from
  # "integration" tests, so this one job's `npm run test` is what satisfies
  # both SCRUM-31 (backend lint+test) and SCRUM-55 (Postgres-backed
  # integration tests): same command, same real DB, same failure mode.
  # DB connection details come from backend/src/test/testEnv.ts, not from
  # anything set here — no credentials live in this repo or this workflow.
  test-backend:
    name: test (backend, w/ Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm run test
        working-directory: backend

  build:
    name: build (${{ matrix.app }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      - run: npm run build
        working-directory: ${{ matrix.app }}

  docker-build:
    name: docker-build (${{ matrix.app }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # --- CD: main only, after every CI job above has passed ---

  migrate:
    name: run production migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test-frontend, test-backend, build, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # Runs against production. Idempotent: a redeploy with no new
      # migrations is a no-op, and Prisma fails loudly (non-zero exit)
      # if a migration fails, which fails this job and blocks deploy-backend.
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-backend:
    name: deploy backend (Render)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        id: trigger
        run: |
          response=$(curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          deploy_id=$(echo "$response" | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Failed to trigger Render deploy: $response"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Poll deploy status
        run: |
          deploy_id="${{ steps.trigger.outputs.deploy_id }}"
          for i in $(seq 1 60); do
            status=$(curl -sf \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | jq -r '.status')
            echo "Render deploy status: $status"
            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Render deploy failed with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render deploy to go live"
          exit 1

  deploy-frontend:
    name: deploy frontend (Vercel)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test-frontend, test-backend, build, docker-build]
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  smoke-test:
    name: post-deploy smoke test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Backend health check
        run: curl -sf "${{ secrets.RENDER_BACKEND_URL }}/health"

      - name: Frontend reachability check
        run: curl -sf "${{ needs.deploy-frontend.outputs.url }}"
